services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped

  mini-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_MODE: live
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

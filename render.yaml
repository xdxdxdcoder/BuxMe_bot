services:
  - type: web
    name: buxme-scout-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"
      - key: SCOUT_DATA_SOURCE
        value: snapshot
      - key: GIGACHAT_API_KEY
        sync: false

version: '1.0'
solution: Buxme AI-Scout
baseUrl: https://buxme-scout-backend.onrender.com
openapi: openapi.yaml
notes: >-
  Проверка проводится с российского IP. При переносе на другой HTTPS-хостинг
  замените baseUrl и сервер в openapi.yaml до отправки организаторам.
  Код сотрудника демонстрационный; рабочие токены здесь отсутствуют.
requiredChecks:
  - id: employee-demo-login
    method: POST
    path: /api/auth/max
    role: public_demo
    request:
      contentType: application/json
      body:
        employeeCode: BUX-2048
        initData: ''
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [id, code, displayName]
  - id: search-fns-moscow
    method: POST
    path: /api/scout/search
    role: public_demo
    request:
      contentType: application/json
      body:
        region: Москва
        limit: 1
        offset: 0
    expected:
      statusCodes: [200]
      contentType: application/json
      requiredFields: [requestId, region, companies, total, availableTotal, offset, hasMore, searchedAt, mode, scoringMode, sourceDate]
      fieldValues:
        mode: registry
  - id: search-invalid-region
    method: POST
    path: /api/scout/search
    role: public_demo
    request:
      contentType: application/json
      body:
        region: ''
    expected:
      statusCodes: [422]
      contentType: application/json
      requiredFields: [detail]
